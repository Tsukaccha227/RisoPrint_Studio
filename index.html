<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RisoPrint Studio</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RisoPrint" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <style>
    :root {
      --bg-dark: #121212;
      --bg-panel: #181818;
      --bg-button: #202020;
      --bg-button-active: #323232;
      --border-color: #343434;
      --text-main: #f5f5f5;
      --text-muted: #a8a8a8;
      --accent: #ffffff;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', 'Hiragino Kaku Gothic ProN', 'Meiryo', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-weight: 700;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(28, 28, 28, 0.96);
      color: #fff;
      border: 1px solid #666;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 200;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Top Bar */
    .top-bar {
      height: 56px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 30;
    }

    .top-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--bg-button);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 9px 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 3px;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
    }

    .btn:hover {
      background: #2a2a2a;
      border-color: #555;
    }

    .btn:active, .btn.flash {
      background: #3d3d3d;
      border-color: #fff;
      transform: scale(0.97);
    }

    .btn.active-toggle {
      background: var(--bg-button-active);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset;
    }

    .btn-icon {
      padding: 9px 11px;
    }

    /* Main Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .canvas-stage {
      flex: 1;
      min-height: 0;
      background: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 14px;
    }

    #mainCanvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.75);
    }

    /* Controls Deck */
    .controls-deck {
      background: var(--bg-dark);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 25;
    }

    /* Inspector / Popup Sheet
     * - Mobile Portrait (<720px): Popup floating sheet
     * - Wide / Foldable (min-width: 720px): Permanently docked in top-right dead zone!
     */
    .popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 40;
      display: none;
    }
    .popup-backdrop.open {
      display: block;
    }

    .inspector-sheet {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 205px;
      background: #181818;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
      z-index: 50;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .inspector-sheet.open {
      display: flex;
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #121212;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .popup-close {
      background: #222;
      border: 1px solid #444;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    .popup-body {
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 45dvh;
      overflow-y: auto;
    }

    /* Section Divider inside Docked Inspector */
    .inspector-subhead {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      border-bottom: 1px solid #292929;
      padding-bottom: 6px;
      margin-top: 2px;
    }

    /* Option Grid */
    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .option-chip {
      background: #232323;
      border: 1px solid #3c3c3c;
      color: var(--text-main);
      padding: 11px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.12s;
    }

    .option-chip.active {
      background: #343434;
      border: 2px solid #ffffff;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    .slider-row label {
      width: 128px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }

    .slider-row input[type="range"] {
      flex: 1;
      height: 6px;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .slider-val {
      width: 44px;
      text-align: right;
      font-weight: 700;
      color: #ffffff;
    }

    /* Ink Layer Tabs */
    .ink-tabs-bar {
      display: flex;
      align-items: center;
      background: #101010;
      border-bottom: 1px solid var(--border-color);
      border-top: 1px solid var(--border-color);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .ink-tabs-bar::-webkit-scrollbar { display: none; }

    .ink-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: #151515;
      border-right: 1px solid var(--border-color);
      cursor: pointer;
      white-space: nowrap;
    }

    .ink-tab.active {
      background: var(--bg-panel);
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .ink-dot {
      width: 12px;
      height: 12px;
      border: 1px solid rgba(255,255,255,0.45);
      display: inline-block;
    }

    .tab-close {
      margin-left: 6px;
      opacity: 0.7;
      font-size: 15px;
      padding: 0 3px;
    }
    .tab-close:hover { opacity: 1; }

    .ink-tab-add {
      padding: 11px 18px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      border-right: 1px solid var(--border-color);
    }
    .ink-tab-add:hover { background: #242424; }

    /* Swatch Bar */
    .swatch-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-panel);
      scrollbar-width: none;
    }
    .swatch-bar::-webkit-scrollbar { display: none; }

    .swatch-auto {
      width: 34px;
      height: 34px;
      border: 2px dashed #888;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      flex-shrink: 0;
      cursor: pointer;
      border-radius: 2px;
    }

    .swatch-item {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.15);
      position: relative;
      border-radius: 2px;
      transition: transform 0.1s;
    }

    .swatch-item.active {
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 2px #000 inset;
      transform: scale(1.08);
    }

    .swatch-item.hatched::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,0.32),
        rgba(255,255,255,0.32) 2px,
        transparent 2px,
        transparent 5px
      );
    }

    /* Main Action Matrix (RANDOM / STYLE / FRAME) */
    .action-matrix {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-dark);
    }

    .matrix-btn {
      height: 52px;
      font-size: 13px;
      font-weight: 700;
      background: #1b1b1b;
      border: 1px solid #353535;
    }

    /* Bottom Bar (GRAIN / PAPER / TONE) */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 14px;
      background: var(--bg-dark);
    }

    .bottom-left {
      display: flex;
      gap: 8px;
    }

    .paper-indicator {
      width: 12px;
      height: 12px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.45);
    }

    /* Preset Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-header {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-save-preset {
      position: relative;
      overflow: hidden;
      background: repeating-linear-gradient(
        -45deg,
        #1b1b1b,
        #1b1b1b 4px,
        #282828 4px,
        #282828 8px
      );
    }

    .preset-grid {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px 14px;
      align-content: start;
    }

    .preset-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .preset-thumb-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #222;
      overflow: hidden;
      border: 1px solid #383838;
      position: relative;
    }

    .preset-card:hover .preset-thumb-wrap {
      border-color: #999;
    }

    .preset-thumb-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preset-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.03em;
    }

    /* ==========================================================
     * 2-Column Layout (Z Fold 8 Unfolded / Tablet / Desktop)
     * Fills the top-right dead zone with the Permanent Inspector!
     * ========================================================== */
    @media (min-width: 720px) {
      .workspace {
        flex-direction: row;
      }
      .canvas-stage {
        flex: 1;
        height: 100%;
      }
      .controls-deck {
        width: 395px;
        height: 100%;
        border-top: none;
        border-left: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .popup-backdrop {
        display: none !important;
      }
      .inspector-sheet {
        position: static;
        display: flex !important;
        flex: 1;
        border: none;
        border-radius: 0;
        box-shadow: none;
        background: #141414;
        min-height: 0;
      }
      .popup-close {
        display: none;
      }
      .popup-body {
        max-height: none;
        flex: 1;
        overflow-y: auto;
        padding: 18px 16px;
        gap: 18px;
      }
      .preset-grid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Action Feedback Toast -->
  <div class="toast" id="toastMsg">APPLIED</div>

  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="top-group">
      <button class="btn" id="btnUpload">IMAGE &times;</button>
      <input type="file" id="fileInput" accept="image/*" hidden />
      <button class="btn" id="btnOpenPresets">PRESET</button>
      <button class="btn btn-icon" id="btnQuickInvert" title="インク順序を反転">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
      </button>
    </div>
    <div class="top-group">
      <button class="btn btn-icon" id="btnSettings" title="設定・PWAアイコン">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button class="btn" id="btnExport">EXPORT</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="workspace">
    <section class="canvas-stage">
      <canvas id="mainCanvas"></canvas>
    </section>

    <!-- Mobile Backdrop -->
    <div class="popup-backdrop" id="popupBackdrop"></div>

    <aside class="controls-deck">
      <!-- Top-Right Docked Inspector (On Wide Screens) / Popup Sheet (On Narrow Phones) -->
      <div class="inspector-sheet" id="popupSheet">
        <div class="popup-header">
          <span id="popupTitle">GRAIN &amp; TEXTURE</span>
          <button class="popup-close" id="btnClosePopup">CLOSE &times;</button>
        </div>
        <div class="popup-body" id="popupBody"></div>
      </div>

      <!-- Bottom Fixed Controls Cluster -->
      <div class="controls-bottom-cluster">
        <!-- Dynamic Ink Layer Tabs -->
        <div class="ink-tabs-bar" id="inkTabsBar"></div>

        <!-- Ink Swatches -->
        <div class="swatch-bar" id="swatchBar">
          <div class="swatch-auto" id="btnAutoBalance" title="Auto Reset Tone">A</div>
        </div>

        <!-- 3 Main Action Buttons -->
        <div class="action-matrix">
          <button class="btn matrix-btn" id="btnRandom">
            <span>&#9860;</span> RANDOM
          </button>
          <button class="btn matrix-btn" id="btnStyle">
            <span>&#9861;</span> STYLE
          </button>
          <button class="btn matrix-btn" id="btnFrame">
            <span>&#9859;</span> FRAME
          </button>
        </div>

        <!-- Bottom Quick Bar -->
        <div class="bottom-bar">
          <div class="bottom-left">
            <button class="btn" id="btnGrain">&#9618; GRAIN</button>
            <button class="btn" id="btnPaper">
              <span class="paper-indicator" id="paperDot"></span> PAPER
            </button>
          </div>
          <button class="btn" id="btnTone">&gt; TONE</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Preset Grid Modal -->
  <div class="modal-overlay" id="presetModal">
    <div class="modal-header">
      <button class="btn" id="btnClosePresets">CLOSE</button>
      <button class="btn btn-save-preset" id="btnSavePreset">&#9734; SAVE PRESET</button>
    </div>
    <div class="preset-grid" id="presetGrid"></div>
  </div>

  <script>
    /**************************************************************
     * RisoPrint Studio Core Engine (v3 Docked Grain Inspector)
     **************************************************************/
    const INKS = [
      { id: 'black',    name: 'BLACK',   hex: '#141414', r: 20,  g: 20,  b: 20,  hatched: false },
      { id: 'blue',     name: 'BLUE',    hex: '#0078bf', r: 0,   g: 120, b: 191, hatched: false },
      { id: 'pink',     name: 'PINK',    hex: '#ff48b0', r: 255, g: 72,  b: 176, hatched: false },
      { id: 'green',    name: 'GREEN',   hex: '#00a95c', r: 0,   g: 169, b: 92,  hatched: false },
      { id: 'orange',   name: 'ORANGE',  hex: '#ff6c2f', r: 255, g: 108, b: 47,  hatched: false },
      { id: 'red',      name: 'RED',     hex: '#ff665e', r: 255, g: 102, b: 94,  hatched: false },
      { id: 'yellow',   name: 'YELLOW',  hex: '#ffe800', r: 255, g: 232, b: 0,   hatched: false },
      { id: 'burgundy', name: 'CRIMSON', hex: '#914e56', r: 145, g: 78,  b: 86,  hatched: true  },
      { id: 'indigo',   name: 'INDIGO',  hex: '#3d5588', r: 61,  g: 85,  b: 136, hatched: true  },
      { id: 'violet',   name: 'VIOLET',  hex: '#765ba7', r: 118, g: 91,  b: 167, hatched: true  },
      { id: 'teal',     name: 'TEAL',    hex: '#236868', r: 35,  g: 104, b: 104, hatched: true  },
      { id: 'slate',    name: 'SLATE',   hex: '#5e6973', r: 94,  g: 105, b: 115, hatched: true  }
    ];

    const PAPERS = [
      { id: 'cream', name: 'CREAM PAPER', hex: '#ece6d8', r: 236, g: 230, b: 216, darkFiber: false },
      { id: 'white', name: 'PURE WHITE',  hex: '#fafafa', r: 250, g: 250, b: 250, darkFiber: false },
      { id: 'kraft', name: 'KRAFT BROWN', hex: '#b69567', r: 182, g: 149, b: 103, darkFiber: true  },
      { id: 'news',  name: 'NEWSPRINT',   hex: '#d8d2c5', r: 216, g: 210, b: 197, darkFiber: true  }
    ];

    const STYLES = [
      { id: 'ROSETTE',  label: 'ROSETTE' },
      { id: 'HALFTONE', label: 'HALFTONE' },
      { id: 'GRAIN',    label: 'GRAIN' },
      { id: 'HATCH',    label: 'HATCH' }
    ];

    const DEFAULT_PRESETS = [
      { title: 'Red + Black',           inks: ['red', 'black'],           paper: 'white', style: 'ROSETTE',  margin: 14, shift: 3 },
      { title: 'Yellow + Blue',         inks: ['yellow', 'blue'],         paper: 'cream', style: 'GRAIN',    margin: 14, shift: 4 },
      { title: 'Black + Pink',          inks: ['black', 'pink'],          paper: 'kraft', style: 'ROSETTE',  margin: 14, shift: 3 },
      { title: 'Yellow + Pink + Blue',  inks: ['yellow', 'pink', 'blue'], paper: 'cream', style: 'ROSETTE',  margin: 14, shift: 4 },
      { title: 'Pink + Blue Rosette',   inks: ['pink', 'blue'],           paper: 'cream', style: 'ROSETTE',  margin: 14, shift: 4 },
      { title: 'Yellow + Red + Blue',   inks: ['yellow', 'red', 'blue'],  paper: 'cream', style: 'HALFTONE', margin: 14, shift: 4 },
      { title: 'Orange + Black Kraft',  inks: ['orange', 'black'],        paper: 'kraft', style: 'ROSETTE',  margin: 0,  shift: 3 },
      { title: 'Orange + Green Shift',  inks: ['orange', 'green'],        paper: 'cream', style: 'GRAIN',    margin: 15, shift: 16 }
    ];

    const state = {
      inks: ['yellow', 'orange', 'blue'],
      activeTabIndex: 0,
      paperIndex: 0,
      styleIndex: 0,
      dotSize: 5.5,
      texture: 48,
      contrast: 115,
      brightness: 0,
      shift: 4,
      margin: 0,
      radius: 18,
      activePopup: 'grain', // Default to showing Grain sliders in the top-right inspector
      mobilePopupOpen: false,

    function createDefaultImage() {
      const c = document.createElement('canvas');
      c.width = 900;
      c.height = 900;
      const g = c.getContext('2d');

      const bgGrad = g.createLinearGradient(0, 0, 0, 900);
      bgGrad.addColorStop(0, '#726c62');
      bgGrad.addColorStop(0.3, '#aca495');
      bgGrad.addColorStop(0.7, '#9c9282');
      bgGrad.addColorStop(1, '#797062');
      g.fillStyle = bgGrad;
      g.fillRect(0, 0, 900, 900);

      for (let i = 0; i < 6500; i++) {
        const x = Math.random() * 900;
        const y = Math.random() * 900;
        const r = Math.random() * 6 + 1;
        g.fillStyle = Math.random() > 0.5 ? 'rgba(60,50,40,0.14)' : 'rgba(245,240,225,0.15)';
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        g.fill();
      }

      g.fillStyle = '#202624';
      g.beginPath();
      g.ellipse(470, 520, 220, 95, -0.08, 0, Math.PI * 2);
      g.fill();

      const shellGrad = g.createRadialGradient(460, 380, 30, 480, 430, 240);
      shellGrad.addColorStop(0, '#ff6d24');
      shellGrad.addColorStop(0.65, '#d64515');
      shellGrad.addColorStop(1, '#5c2410');
      g.fillStyle = shellGrad;
      g.beginPath();
      g.ellipse(495, 420, 210, 145, 0.12, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = 'rgba(255, 230, 180, 0.7)';
      g.beginPath();
      g.ellipse(435, 455, 38, 18, -0.6, 0, Math.PI * 2);
      g.fill();

      const img = new Image();
      img.onload = () => {
        state.sourceImage = img;
        renderAll();
      };
      img.src = c.toDataURL();
    }

        el.style.backgroundColor = ink.hex;
        el.dataset.id = ink.id;
        el.title = ink.name;
        el.addEventListener('click', () => {
          state.inks[state.activeTabIndex] = ink.id;
          updateUI();
          renderMainCanvas();
          showToast(`INK ${state.activeTabIndex + 1}: ${ink.name}`);
        });
        swatchBar.appendChild(el);
      });

    function updateUI() {
      inkTabsBar.innerHTML = '';
      state.inks.forEach((inkId, idx) => {
        const ink = INKS.find(i => i.id === inkId) || INKS[0];
        const tab = document.createElement('div');
        tab.className = 'ink-tab' + (idx === state.activeTabIndex ? ' active' : '');
        tab.innerHTML = `
          <span class="ink-dot" style="background:${ink.hex}"></span>
          <span>${ink.name}</span>
          ${state.inks.length > 1 ? `<span class="tab-close" data-idx="${idx}">&times;</span>` : ''}
        `;
        tab.addEventListener('click', (e) => {
          if (e.target.classList.contains('tab-close')) {
            const removeIdx = parseInt(e.target.dataset.idx, 10);
            state.inks.splice(removeIdx, 1);
            if (state.activeTabIndex >= state.inks.length) {
              state.activeTabIndex = state.inks.length - 1;
            }
            updateUI();
            renderMainCanvas();
            showToast('INK LAYER REMOVED');
            return;
          }
          state.activeTabIndex = idx;
          updateUI();
        });
        inkTabsBar.appendChild(tab);
      });

      if (state.inks.length < 3) {
        const addBtn = document.createElement('div');
        addBtn.className = 'ink-tab-add';
        addBtn.textContent = '+';
        addBtn.title = 'インク版を追加 (最大3色)';
        addBtn.addEventListener('click', () => {
          const unused = INKS.find(i => !state.inks.includes(i.id)) || INKS[0];
          state.inks.push(unused.id);
          state.activeTabIndex = state.inks.length - 1;
          updateUI();
          renderMainCanvas();
          showToast(`ADDED: ${unused.name}`);
        });
        inkTabsBar.appendChild(addBtn);
      }

      const activeInkId = state.inks[state.activeTabIndex];
      document.querySelectorAll('.swatch-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === activeInkId);
      });

      const paper = PAPERS[state.paperIndex];
      paperDot.style.backgroundColor = paper.hex;

      const isWide = window.innerWidth >= 720;
      const mapBtn = {
        style: 'btnStyle',

    function createSlider(label, key, min, max, step, unit) {
      const row = document.createElement('div');

      input.min = min;

      input.step = step;
      input.value = state[key];

      row.appendChild(lbl);
      row.appendChild(input);
      row.appendChild(valSpan);
      return row;
    }

    /**
     * Core Riso / Halftone Renderer
     */
    function renderRisoToCanvas(targetCanvas, config, workWidth = 880) {
      if (!state.sourceImage) return;

      const img = state.sourceImage;
      const aspect = img.height / img.width;
      const w = workWidth;
      const h = Math.round(workWidth * aspect);

      targetCanvas.width = w;
      targetCanvas.height = h;
      const tCtx = targetCanvas.getContext('2d');

      const paper = PAPERS.find(p => p.id === config.paperId) || PAPERS[0];
      const styleMode = config.styleMode || 'ROSETTE';
      const dotSize = config.dotSize || 5.5;
      const contrast = (config.contrast || 115) / 100;
      const brightOffset = (config.brightness || 0) / 100;
      const textureAmt = (config.texture ?? 48) / 100;
      const marginRatio = (config.margin || 0) / 100;
      const shiftPx = (config.shift ?? 4) * (workWidth / 880);

      tCtx.fillStyle = paper.hex;
      tCtx.fillRect(0, 0, w, h);

      const padX = Math.round(w * marginRatio);
      const padY = Math.round(h * marginRatio);
      const innerW = Math.max(10, w - padX * 2);
      const innerH = Math.max(10, h - padY * 2);

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = innerW;
      srcCanvas.height = innerH;
      const srcCtx = srcCanvas.getContext('2d');
      srcCtx.drawImage(img, 0, 0, innerW, innerH);
      const srcData = srcCtx.getImageData(0, 0, innerW, innerH).data;

      const outImgData = tCtx.getImageData(0, 0, w, h);
      const out = outImgData.data;

      const inkObjs = config.inks.map(id => INKS.find(i => i.id === id) || INKS[0]);
      const angles = [0.26, 1.30, 0.78];

      const freq = (Math.PI * 2) / Math.max(2, dotSize * (workWidth / 880));
      const cornerRadius = marginRatio > 0 ? Math.round((config.radius ?? 18) * (workWidth / 880)) : 0;

      function insideRoundedRect(x, y, rw, rh, rad) {
        if (x < 0 || y < 0 || x >= rw || y >= rh) return false;
        if (rad <= 0) return true;
        if (x < rad && y < rad) return (x - rad) ** 2 + (y - rad) ** 2 <= rad * rad;
        if (x > rw - rad && y < rad) return (x - (rw - rad)) ** 2 + (y - rad) ** 2 <= rad * rad;
        if (x < rad && y > rh - rad) return (x - rad) ** 2 + (y - (rh - rad)) ** 2 <= rad * rad;
        if (x > rw - rad && y > rh - rad) return (x - (rw - rad)) ** 2 + (y - (rh - rad)) ** 2 <= rad * rad;
        return true;
      }

      function hashNoise(x, y) {
        const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const outIdx = (y * w + x) * 4;

          const weave = (Math.sin(x * 1.4) + Math.cos(y * 1.4)) * 0.5;
          const fineGrain = (hashNoise(x, y) - 0.5) * 2;
          const fiberDelta = (weave * 7 + fineGrain * 18) * textureAmt;

          let pr = paper.r + fiberDelta;
          let pg = paper.g + fiberDelta;
          let pb = paper.b + fiberDelta;

          if (paper.darkFiber && fineGrain > 0.65) {
            pr -= 18 * textureAmt;
            pg -= 18 * textureAmt;
            pb -= 18 * textureAmt;
          }

          for (let k = 0; k < inkObjs.length; k++) {
            const ink = inkObjs[k];
            const shiftX = k === 0 ? 0 : (k === 1 ? shiftPx : -shiftPx * 0.7);
            const shiftY = k === 0 ? 0 : (k === 1 ? shiftPx * 0.6 : shiftPx);

            const sx = Math.round(x - padX - shiftX);
            const sy = Math.round(y - padY - shiftY);

            if (!insideRoundedRect(sx, sy, innerW, innerH, cornerRadius)) continue;

            const pIdx = (sy * innerW + sx) * 4;
            const r = Math.min(1, Math.max(0, srcData[pIdx] / 255 + brightOffset));
            const g = Math.min(1, Math.max(0, srcData[pIdx + 1] / 255 + brightOffset));
            const b = Math.min(1, Math.max(0, srcData[pIdx + 2] / 255 + brightOffset));

            let density = 0;
            const luma = 0.299 * r + 0.587 * g + 0.114 * b;
            const cLuma = Math.min(1, Math.max(0, (luma - 0.5) * contrast + 0.5));

            if (inkObjs.length === 1) {
              density = 1 - cLuma;
            } else if (inkObjs.length === 2) {
              if (k === 0) {
                const warmDiff = Math.max(0, r - b * 0.65);
                density = Math.min(1, warmDiff * 1.35 + (1 - cLuma) * 0.45);
              } else {
                density = Math.pow(1 - cLuma, 1.15);
              }
            } else {
              if (k === 0) {
                density = Math.min(1, Math.max(0, (r + g * 0.5 - b) * 0.9));
              } else if (k === 1) {
                density = Math.min(1, Math.max(0, (r - g * 0.35) * 1.25 + (1 - cLuma) * 0.25));
              } else {
                density = Math.pow(1 - cLuma, 1.25);
              }
            }

            const ang = angles[k % 3];
            const rx = x * Math.cos(ang) - y * Math.sin(ang);
            const ry = x * Math.sin(ang) + y * Math.cos(ang);

            let threshold = 0.5;
            if (styleMode === 'ROSETTE') {
              const s = (Math.sin(rx * freq) + Math.cos(ry * freq)) * 0.25 + 0.5;
              threshold = s * 0.82 + fineGrain * 0.09;
            } else if (styleMode === 'HALFTONE') {
              threshold = (Math.sin(rx * freq) * Math.sin(ry * freq)) * 0.45 + 0.5;
            } else if (styleMode === 'GRAIN') {
              threshold = hashNoise(x + k * 71, y + k * 43) * 0.88 + 0.06;
            } else if (styleMode === 'HATCH') {
              threshold = (Math.sin(rx * freq * 1.25) * 0.45 + 0.5) * 0.85 + fineGrain * 0.08;
            }

            const inkAlpha = Math.min(1, Math.max(0, (density - threshold + 0.14) * 3.6));

            if (inkAlpha > 0.01) {
              const strength = 0.86 * inkAlpha;
              const multR = (pr * ink.r) / 255;
              const multG = (pg * ink.g) / 255;
              const multB = (pb * ink.b) / 255;

              const targetR = multR * 0.55 + ink.r * 0.45;
              const targetG = multG * 0.55 + ink.g * 0.45;
              const targetB = multB * 0.55 + ink.b * 0.45;

              pr = pr * (1 - strength) + targetR * strength;
              pg = pg * (1 - strength) + targetG * strength;
              pb = pb * (1 - strength) + targetB * strength;
            }
          }

          out[outIdx]     = Math.min(255, Math.max(0, pr));
          out[outIdx + 1] = Math.min(255, Math.max(0, pg));
          out[outIdx + 2] = Math.min(255, Math.max(0, pb));
          out[outIdx + 3] = 255;
        }
      }

      tCtx.putImageData(outImgData, 0, 0);
    }

    function getCurrentConfig() {
      return {
        inks: [...state.inks],
        paperId: PAPERS[state.paperIndex].id,
        styleMode: STYLES[state.styleIndex].id,

        texture: state.texture,
        contrast: state.contrast,
        brightness: state.brightness,
        shift: state.shift,
        margin: state.margin,
        radius: state.radius
      };
    }

    function renderMainCanvas() {
      renderRisoToCanvas(mainCanvas, getCurrentConfig(), 840);

          }, 240);
        }, 10);

        card.addEventListener('click', () => {
          state.inks = [...p.inks];
          state.activeTabIndex = 0;
          const pIdx = PAPERS.findIndex(item => item.id === p.paper);
          if (pIdx !== -1) state.paperIndex = pIdx;
          const sIdx = STYLES.findIndex(item => item.id === p.style);
          if (sIdx !== -1) state.styleIndex = sIdx;
          state.margin = p.margin ?? 14;
          state.shift = p.shift ?? 4;

          document.getElementById('presetModal').classList.remove('open');
          openInspector(state.activePopup || 'grain');
          renderAll();
          showToast(`PRESET: ${p.title}`);
        });
      });
    }

    function downloadPWAIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const g = c.getContext('2d');
      const s = size / 512;

      g.fillStyle = '#121212';
      g.fillRect(0, 0, size, size);

      g.fillStyle = '#1c1c1c';
      g.strokeStyle = '#333333';
      g.lineWidth = 8 * s;
      const pad = 42 * s;
      const w = size - pad * 2;
      g.beginPath();
      g.roundRect(pad, pad, w, w, 84 * s);
      g.fill();
      g.stroke();

      g.globalCompositeOperation = 'screen';
      g.fillStyle = '#ff48b0';
      g.beginPath();
      g.arc(215 * s, 235 * s, 105 * s, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = '#0078bf';
      g.beginPath();
      g.arc(298 * s, 278 * s, 105 * s, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = '#ffe800';
      g.beginPath();
      g.arc(256 * s, 200 * s, 72 * s, 0, Math.PI * 2);
      g.fill();

      g.globalCompositeOperation = 'source-over';

      c.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

      reader.readAsDataURL(file);

      state.dotSize = 5.5;

      openInspector(state.activePopup || 'grain');

    document.getElementById('btnRandom').addEventListener('click', (e) => {
      flashButton(e.currentTarget);
      const count = Math.random() > 0.35 ? 2 : 3;
      const shuffled = [...INKS].sort(() => 0.5 - Math.random());
      state.inks = shuffled.slice(0, count).map(i => i.id);
      state.activeTabIndex = 0;
      state.paperIndex = Math.floor(Math.random() * PAPERS.length);
      state.styleIndex = Math.floor(Math.random() * STYLES.length);
      openInspector(state.activePopup || 'grain');
      renderAll();
      const names = state.inks.map(id => INKS.find(i => i.id === id).name).join(' + ');
      showToast(`RANDOM: ${names}`);
    });

    // Inspector / Popup Trigger Buttons
    document.getElementById('btnStyle').addEventListener('click', () => openInspector('style', true));
    document.getElementById('btnFrame').addEventListener('click', () => openInspector('frame', true));
    document.getElementById('btnGrain').addEventListener('click', () => openInspector('grain', true));
    document.getElementById('btnPaper').addEventListener('click', () => openInspector('paper', true));
    document.getElementById('btnTone').addEventListener('click', () => openInspector('tone', true));
    document.getElementById('btnSettings').addEventListener('click', () => openInspector('settings', true));

    document.getElementById('btnClosePopup').addEventListener('click', closeMobilePopup);
    popupBackdrop.addEventListener('click', closeMobilePopup);
    window.addEventListener('resize', () => updateUI());

    // Presets Modal
    document.getElementById('btnOpenPresets').addEventListener('click', () => {
      closeMobilePopup();
      document.getElementById('presetModal').classList.add('open');
      renderPresetGrid();
    });

    document.getElementById('btnClosePresets').addEventListener('click', () => {
      document.getElementById('presetModal').classList.remove('open');
    });

    document.getElementById('btnSavePreset').addEventListener('click', () => {
      const title = state.inks
        .map(id => {
          const name = INKS.find(i => i.id === id)?.name || id;
          return name.charAt(0) + name.slice(1).toLowerCase();
        })
        .join(' + ');

      const newPreset = {
        title: title + ' Custom',
        inks: [...state.inks],
        paper: PAPERS[state.paperIndex].id,
        style: STYLES[state.styleIndex].id,
        margin: state.margin || 14,
        shift: state.shift
      };

      state.presets.unshift(newPreset);
      try {
        const customOnly = state.presets.slice(0, state.presets.length - DEFAULT_PRESETS.length);
        localStorage.setItem('risoprint_custom_presets', JSON.stringify(customOnly));
      } catch (e) {}
      renderPresetGrid();
      showToast('PRESET SAVED');
    });

    // High-Res Export
    document.getElementById('btnExport').addEventListener('click', (e) => {
      flashButton(e.currentTarget);
      showToast('EXPORTING HIGH-RES PNG...');
      setTimeout(() => {
        const exportCanvas = document.createElement('canvas');
        renderRisoToCanvas(exportCanvas, getCurrentConfig(), 2000);
        exportCanvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `risoprint-${Date.now()}.png`;
          a.click();
          URL.revokeObjectURL(url);
        }, 'image/png');
      }, 50);
    });

    // Init
    initSwatches();
    openInspector('grain'); // Render Grain sliders into the top-right inspector on startup
    createDefaultImage();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
