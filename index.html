<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RisoPrint Studio</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RisoPrint" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <style>
    :root {
      --bg-dark: #121212;
      --bg-panel: #181818;
      --bg-button: #1d1d1d;
      --border-color: #2e2e2e;
      --text-main: #e8e8e8;
      --text-muted: #8c8c8c;
      --accent: #ffffff;
      --font-mono: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-mono);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      height: 54px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 20;
    }

    .top-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--bg-button);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 13px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 2px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: #252525;
      border-color: #444;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-icon {
      padding: 8px 10px;
    }

    /* Main Workspace (Responsive 2-column for Z Fold / Tablet / Desktop) */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .canvas-stage {
      flex: 1;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 12px;
    }

    #mainCanvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      transition: opacity 0.15s;
    }

    /* Controls Deck */
    .controls-deck {
      background: var(--bg-dark);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 15;
    }

    /* Ink Layer Tabs */
    .ink-tabs-bar {
      display: flex;
      align-items: center;
      background: #0f0f0f;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .ink-tabs-bar::-webkit-scrollbar { display: none; }

    .ink-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: #141414;
      border-right: 1px solid var(--border-color);
      cursor: pointer;
      white-space: nowrap;
    }

    .ink-tab.active {
      background: var(--bg-panel);
      color: var(--text-main);
      font-weight: 600;
    }

    .ink-dot {
      width: 11px;
      height: 11px;
      border: 1px solid rgba(255,255,255,0.35);
      display: inline-block;
    }

    .tab-close {
      margin-left: 4px;
      opacity: 0.6;
      font-size: 13px;
      padding: 0 2px;
    }
    .tab-close:hover { opacity: 1; }

    .ink-tab-add {
      padding: 10px 16px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      border-right: 1px solid var(--border-color);
    }
    .ink-tab-add:hover { color: var(--text-main); background: #1e1e1e; }

    /* Swatch Bar */
    .swatch-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-panel);
      scrollbar-width: none;
    }
    .swatch-bar::-webkit-scrollbar { display: none; }

    .swatch-auto {
      width: 32px;
      height: 32px;
      border: 1px dashed #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-main);
      flex-shrink: 0;
      cursor: pointer;
    }

    .swatch-item {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      transition: transform 0.1s;
    }

    .swatch-item.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 1px #000 inset;
      transform: scale(1.06);
    }

    .swatch-item.hatched::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
         rgba(255,255,255,0.28),
        rgba(255,255,255,0.28) 2px,
        transparent 2px,
        transparent 5px
      );
    }

    /* Main Action Matrix (RANDOM / STYLE / FRAME) */
    .action-matrix {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-dark);
    }

    .matrix-btn {
      height: 52px;
      font-size: 12px;
      background: #171717;
      border: 1px solid #2b2b2b;
    }

    /* Sub Controls Drawer (Sliders for Grain / Paper / Tone / Frame) */
    .drawer-panel {
      background: #151515;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-panel.open {
      display: flex;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .slider-row label {
      width: 110px;
      flex-shrink: 0;
      letter-spacing: 0.05em;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .slider-val {
      width: 38px;
      text-align: right;
      color: var(--text-main);
    }

    /* Bottom Bar (GRAIN / PAPER / TONE) */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-dark);
    }

    .bottom-left {
      display: flex;
      gap: 8px;
    }

    .paper-indicator {
      width: 11px;
      height: 11px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* Preset Modal (Screenshot 1 Faithful Grid) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-header {
      height: 56px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-save-preset {
      position: relative;
      overflow: hidden;
      background: repeating-linear-gradient(
        -45deg,
        #1b1b1b,
        #1b1b1b 4px,
        #252525 4px,
        #252525 8px
      );
    }

    .preset-grid {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px 14px;
      align-content: start;
    }

    .preset-card {
      display: flex;
      flex-direction: column;
      gap: 7px;
      cursor: pointer;
    }

    .preset-thumb-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #222;
      overflow: hidden;
      border: 1px solid #2e2e2e;
      position: relative;
    }

    .preset-card:hover .preset-thumb-wrap {
      border-color: #777;
    }

    .preset-thumb-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preset-title {
      font-size: 12px;
      color: var(--text-main);
      letter-spacing: 0.03em;
    }

    /* Foldable / Wide Layout (Galaxy Z Fold 8 & Desktop) */
    @media (min-width: 760px) {
      .workspace {
        flex-direction: row;
      }
      .canvas-stage {
        flex: 1;
        height: 100%;
      }
      .controls-deck {
        width: 390px;
        height: 100%;
        border-top: none;
        border-left: 1px solid var(--border-color);
        justify-content: flex-end;
      }
      .drawer-panel {
        flex: 1;
        display: flex;
        overflow-y: auto;
      }
      .preset-grid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
      }
    }

    /* Icon Preview Box */
    .icon-dl-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 6px;
      border-top: 1px solid #2a2a2a;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="top-group">
      <button class="btn" id="btnUpload">IMAGE &times;</button>
      <input type="file" id="fileInput" accept="image/*" hidden />
      <button class="btn" id="btnOpenPresets">PRESET</button>
      <button class="btn btn-icon" id="btnQuickInvert" title="Invert Ink Order">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
        </svg>
      </button>
    </div>
    <div class="top-group">
      <button class="btn btn-icon" id="btnSettings" title="Settings & PWA Icons">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button class="btn" id="btnExport">EXPORT</button>
    </div>
  </header>

  <!-- Workspace -->
  <main class="workspace">
    <section class="canvas-stage">
      <canvas id="mainCanvas"></canvas>
    </section>

    <aside class="controls-deck">
      <!-- Dynamic Ink Layer Tabs -->
      <div class="ink-tabs-bar" id="inkTabsBar"></div>

      <!-- Ink Swatches -->
      <div class="swatch-bar" id="swatchBar">
        <div class="swatch-auto" id="btnAutoBalance" title="Auto Tone Balance">A</div>
      </div>

      <!-- Parameter Drawer -->
      <div class="drawer-panel" id="drawerPanel">
        <div class="slider-row">
          <label>DOT / GRAIN SIZE</label>
          <input type="range" id="rngDotSize" min="2" max="16" step="0.5" value="5.5" />
          <span class="slider-val" id="valDotSize">5.5</span>
        </div>
        <div class="slider-row">
          <label>PAPER TEXTURE</label>
          <input type="range" id="rngTexture" min="0" max="100" value="48" />
          <span class="slider-val" id="valTexture">48%</span>
        </div>
        <div class="slider-row">
          <label>CONTRAST / TONE</label>
          <input type="range" id="rngContrast" min="50" max="180" value="115" />
          <span class="slider-val" id="valContrast">115</span>
        </div>
        <div class="slider-row">
          <label>INK SHIFT (X/Y)</label>
          <input type="range" id="rngShift" min="0" max="24" value="4" />
          <span class="slider-val" id="valShift">4px</span>
        </div>
        <div class="slider-row">
          <label>FRAME MARGIN</label>
          <input type="range" id="rngMargin" min="0" max="22" value="0" />
          <span class="slider-val" id="valMargin">0%</span>
        </div>
        <!-- PWA Icon Exporter inside Settings Drawer -->
        <div class="icon-dl-box">
          <span style="font-size:11px; color:var(--text-muted); flex:1;">PWA ICONS (PNG)</span>
          <button class="btn" id="btnDl192" style="padding:5px 9px; font-size:11px;">192×192</button>
          <button class="btn" id="btnDl512" style="padding:5px 9px; font-size:11px;">512×512</button>
        </div>
      </div>

      <!-- 3 Main Action Buttons -->
      <div class="action-matrix">
        <button class="btn matrix-btn" id="btnRandom">
          <span>&#9860;</span> RANDOM
        </button>
        <button class="btn matrix-btn" id="btnStyle">
          <span>&#9861;</span> STYLE: <span id="lblStyle">ROSETTE</span>
        </button>
        <button class="btn matrix-btn" id="btnFrame">
          <span>&#9859;</span> FRAME
        </button>
      </div>

      <!-- Bottom Quick Bar -->
      <div class="bottom-bar">
        <div class="bottom-left">
          <button class="btn" id="btnGrainToggle">&#9618; GRAIN</button>
          <button class="btn" id="btnPaperCycle">
            <span class="paper-indicator" id="paperDot"></span> PAPER
          </button>
        </div>
        <button class="btn" id="btnToneDrawer">&gt; TONE</button>
      </div>
    </aside>
  </main>

  <!-- Preset Grid Modal (Screenshot 1) -->
  <div class="modal-overlay" id="presetModal">
    <div class="modal-header">
      <button class="btn" id="btnClosePresets">CLOSE</button>
      <button class="btn btn-save-preset" id="btnSavePreset">&#9734; SAVE PRESET</button>
    </div>
    <div class="preset-grid" id="presetGrid"></div>
  </div>

  <script>
    /**************************************************************
     * RisoPrint Studio Core Engine
     **************************************************************/
    const INKS = [
      { id: 'black',      name: 'BLACK',       hex: '#141414', r: 20,  g: 20,  b: 20,  hatched: false },
      { id: 'blue',       name: 'BLUE',        hex: '#0078bf', r: 0,   g: 120, b: 191, hatched: false },
      { id: 'pink',       name: 'PINK',        hex: '#ff48b0', r: 255, g: 72,  b: 176, hatched: false },
      { id: 'green',      name: 'GREEN',       hex: '#00a95c', r: 0,   g: 169, b: 92,  hatched: false },
      { id: 'orange',     name: 'ORANGE',      hex: '#ff6c2f', r: 255, g: 108, b: 47,  hatched: false },
      { id: 'red',        name: 'RED',         hex: '#ff665e', r: 255, g: 102, b: 94,  hatched: false },
      { id: 'yellow',     name: 'YELLOW',      hex: '#ffe800', r: 255, g: 232, b: 0,   hatched: false },
      { id: 'burgundy',   name: 'CRIMSON',     hex: '#914e56', r: 145, g: 78,  b: 86,  hatched: true  },
      { id: 'indigo',     name: 'INDIGO',      hex: '#3d5588', r: 61,  g: 85,  b: 136, hatched: true  },
      { id: 'violet',     name: 'VIOLET',      hex: '#765ba7', r: 118, g: 91,  b: 167, hatched: true  },
      { id: 'teal',       name: 'TEAL',        hex: '#236868', r: 35,  g: 104, b: 104, hatched: true  },
      { id: 'slate',      name: 'SLATE',       hex: '#5e6973', r: 94,  g: 105, b: 115, hatched: true  }
    ];

    const PAPERS = [
      { id: 'cream', name: 'CREAM', hex: '#ece6d8', r: 236, g: 230, b: 216, darkFiber: false },
      { id: 'white', name: 'WHITE', hex: '#fafafa', r: 250, g: 250, b: 250, darkFiber: false },
      { id: 'kraft', name: 'KRAFT', hex: '#b69567', r: 182, g: 149, b: 103, darkFiber: true  },
      { id: 'news',  name: 'NEWS',  hex: '#d8d2c5', r: 216, g: 210, b: 197, darkFiber: true  }
    ];

    const STYLES = ['ROSETTE', 'HALFTONE', 'GRAIN', 'HATCH'];

    const DEFAULT_PRESETS = [
      { title: 'Red + Black',           inks: ['red', 'black'],            paper: 'white', style: 'ROSETTE',  margin: 14, shift: 3 },
      { title: 'Yellow + Blue',         inks: ['yellow', 'blue'],          paper: 'cream', style: 'GRAIN',    margin: 14, shift: 4 },
      { title: 'Black + Pink',          inks: ['black', 'pink'],           paper: 'kraft', style: 'ROSETTE',  margin: 14, shift: 3 },
      { title: 'Yellow + Pink + Blue',  inks: ['yellow', 'pink', 'blue'],  paper: 'cream', style: 'ROSETTE',  margin: 14, shift: 4 },
      { title: 'Pink + Blue Rosette',   inks: ['pink', 'blue'],            paper: 'cream', style: 'ROSETTE',  margin: 14, shift: 4 },
      { title: 'Yellow + Red + Blue',   inks: ['yellow', 'red', 'blue'],   paper: 'cream', style: 'HALFTONE', margin: 14, shift: 4 },
      { title: 'Orange + Black Kraft',  inks: ['orange', 'black'],         paper: 'kraft', style: 'ROSETTE',  margin: 0,  shift: 3 },
      { title: 'Orange + Green Shift',  inks: ['orange', 'green'],         paper: 'cream', style: 'GRAIN',    margin: 15, shift: 16 }
    ];

    // App State
    const state = {
      inks: ['yellow', 'orange', 'blue'],
      activeTabIndex: 0,
      paperIndex: 0,
      styleIndex: 0,
      dotSize: 5.5,
      texture: 48,
      contrast: 115,
      shift: 4,
      margin: 0,
      sourceImage: null,
      presets: [...DEFAULT_PRESETS]
    };

    // Load saved presets
    try {
      const saved = localStorage.getItem('risoprint_custom_presets');
      if (saved) {
        state.presets = [...DEFAULT_PRESETS, ...JSON.parse(saved)];
      }
    } catch (e) {}

    // DOM Elements
    const mainCanvas = document.getElementById('mainCanvas');
    const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });
    const inkTabsBar = document.getElementById('inkTabsBar');
    const swatchBar = document.getElementById('swatchBar');
    const drawerPanel = document.getElementById('drawerPanel');
    const paperDot = document.getElementById('paperDot');
    const lblStyle = document.getElementById('lblStyle');

    // Generate procedural default sample image (retro tortoise/creature on sand like screenshot)
    function createDefaultImage() {
      const c = document.createElement('canvas');
      c.width = 900;
      c.height = 900;
      const g = c.getContext('2d');

      // Sand background gradient
      const bgGrad = g.createLinearGradient(0, 0, 0, 900);
      bgGrad.addColorStop(0, '#726c62');
      bgGrad.addColorStop(0.3, '#aca495');
      bgGrad.addColorStop(0.7, '#9c9282');
      bgGrad.addColorStop(1, '#797062');
      g.fillStyle = bgGrad;
      g.fillRect(0, 0, 900, 900);

      // Dunes / Sand ripples
      for (let i = 0; i < 6500; i++) {
        const x = Math.random() * 900;
        const y = Math.random() * 900;
        const r = Math.random() * 6 + 1;
        g.fillStyle = Math.random() > 0.5 ? 'rgba(60,50,40,0.14)' : 'rgba(245,240,225,0.15)';
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        g.fill();
      }

      // Deep shadow under subject
      g.fillStyle = '#202624';
      g.beginPath();
      g.ellipse(470, 520, 220, 95, -0.08, 0, Math.PI * 2);
      g.fill();

      // Warm reddish/orange shell/body
      const shellGrad = g.createRadialGradient(460, 380, 30, 480, 430, 240);
      shellGrad.addColorStop(0, '#ff6d24');
      shellGrad.addColorStop(0.65, '#d64515');
      shellGrad.addColorStop(1, '#5c2410');
      g.fillStyle = shellGrad;
      g.beginPath();
      g.ellipse(495, 420, 210, 145, 0.12, 0, Math.PI * 2);
      g.fill();

      // Highlights on shell
      g.fillStyle = 'rgba(255, 230, 180, 0.7)';
      g.beginPath();
      g.ellipse(435, 455, 38, 18, -0.6, 0, Math.PI * 2);
      g.fill();

      const img = new Image();
      img.onload = () => {
        state.sourceImage = img;
        renderAll();
      };
      img.src = c.toDataURL();
    }

    // Build UI Swatches
    function initSwatches() {
      INKS.forEach((ink) => {
        const el = document.createElement('div');
        el.className = 'swatch-item' + (ink.hatched ? ' hatched' : '');
        el.style.backgroundColor = ink.hex;
        el.dataset.id = ink.id;
        el.title = ink.name;
        el.addEventListener('click', () => {
          state.inks[state.activeTabIndex] = ink.id;
          updateUI();
          renderMainCanvas();
        });
        swatchBar.appendChild(el);
      });
    }

    // Update UI Tabs & Active States
    function updateUI() {
      inkTabsBar.innerHTML = '';
      state.inks.forEach((inkId, idx) => {
        const ink = INKS.find(i => i.id === inkId) || INKS[0];
        const tab = document.createElement('div');
        tab.className = 'ink-tab' + (idx === state.activeTabIndex ? ' active' : '');
        tab.innerHTML = `
          <span class="ink-dot" style="background:${ink.hex}"></span>
          <span>${ink.name}</span>
          ${state.inks.length > 1 ? `<span class="tab-close" data-idx="${idx}">&times;</span>` : ''}
        `;
        tab.addEventListener('click', (e) => {
          if (e.target.classList.contains('tab-close')) {
            const removeIdx = parseInt(e.target.dataset.idx, 10);
            state.inks.splice(removeIdx, 1);
            if (state.activeTabIndex >= state.inks.length) {
              state.activeTabIndex = state.inks.length - 1;
            }
            updateUI();
            renderMainCanvas();
            return;
          }
          state.activeTabIndex = idx;
          updateUI();
        });
        inkTabsBar.appendChild(tab);
      });

      if (state.inks.length < 3) {
        const addBtn = document.createElement('div');
        addBtn.className = 'ink-tab-add';
        addBtn.textContent = '+';
        addBtn.title = 'Add Ink Layer (Max 3)';
        addBtn.addEventListener('click', () => {
          const unused = INKS.find(i => !state.inks.includes(i.id)) || INKS[0];
          state.inks.push(unused.id);
          state.activeTabIndex = state.inks.length - 1;
          updateUI();
          renderMainCanvas();
        });
        inkTabsBar.appendChild(addBtn);
      }

      // Highlight active swatch
      const activeInkId = state.inks[state.activeTabIndex];
      document.querySelectorAll('.swatch-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === activeInkId);
      });

      // Paper & Style labels
      const paper = PAPERS[state.paperIndex];
      paperDot.style.backgroundColor = paper.hex;
      lblStyle.textContent = STYLES[state.styleIndex];

      // Sliders sync
      document.getElementById('rngDotSize').value = state.dotSize;
      document.getElementById('valDotSize').textContent = state.dotSize;
      document.getElementById('rngTexture').value = state.texture;
      document.getElementById('valTexture').textContent = state.texture + '%';
      document.getElementById('rngContrast').value = state.contrast;
      document.getElementById('valContrast').textContent = state.contrast;
      document.getElementById('rngShift').value = state.shift;
      document.getElementById('valShift').textContent = state.shift + 'px';
      document.getElementById('rngMargin').value = state.margin;
      document.getElementById('valMargin').textContent = state.margin + '%';
    }

    /**
     * Core Riso / Halftone Renderer
     */
    function renderRisoToCanvas(targetCanvas, config, workWidth = 900) {
      if (!state.sourceImage) return;

      const img = state.sourceImage;
      const aspect = img.height / img.width;
      const w = workWidth;
      const h = Math.round(workWidth * aspect);

      targetCanvas.width = w;
      targetCanvas.height = h;
      const tCtx = targetCanvas.getContext('2d');

      const paper = PAPERS.find(p => p.id === config.paperId) || PAPERS[0];
      const styleMode = config.styleMode || 'ROSETTE';
      const dotSize = config.dotSize || 5.5;
      const contrast = (config.contrast || 115) / 100;
      const textureAmt = (config.texture ?? 48) / 100;
      const marginRatio = (config.margin || 0) / 100;
      const shiftPx = (config.shift ?? 4) * (workWidth / 900);

      // 1. Draw Base Paper
      tCtx.fillStyle = paper.hex;
      tCtx.fillRect(0, 0, w, h);

      // Draw image offscreen to read pixels
      const padX = Math.round(w * marginRatio);
      const padY = Math.round(h * marginRatio);
      const innerW = Math.max(10, w - padX * 2);
      const innerH = Math.max(10, h - padY * 2);

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = innerW;
      srcCanvas.height = innerH;
      const srcCtx = srcCanvas.getContext('2d');
      srcCtx.drawImage(img, 0, 0, innerW, innerH);
      const srcData = srcCtx.getImageData(0, 0, innerW, innerH).data;

      // Prepare Output ImageData
      const outImgData = tCtx.getImageData(0, 0, w, h);
      const out = outImgData.data;

      const inkObjs = config.inks.map(id => INKS.find(i => i.id === id) || INKS[0]);
      const angles = [0.26, 1.30, 0.78]; // ~15deg, ~75deg, ~45deg for rosette

      const freq = (Math.PI * 2) / Math.max(2, dotSize * (workWidth / 900));
      const cornerRadius = marginRatio > 0 ? Math.round(Math.min(innerW, innerH) * 0.03) : 0;

      // Helper for rounded rect mask
      function insideRoundedRect(x, y, rw, rh, rad) {
        if (x < 0 || y < 0 || x >= rw || y >= rh) return false;
        if (rad <= 0) return true;
        if (x < rad && y < rad) {
          return (x - rad) ** 2 + (y - rad) ** 2 <= rad * rad;
        }
        if (x > rw - rad && y < rad) {
          return (x - (rw - rad)) ** 2 + (y - rad) ** 2 <= rad * rad;
        }
        if (x < rad && y > rh - rad) {
          return (x - rad) ** 2 + (y - (rh - rad)) ** 2 <= rad * rad;
        }
        if (x > rw - rad && y > rh - rad) {
          return (x - (rw - rad)) ** 2 + (y - (rh - rad)) ** 2 <= rad * rad;
        }
        return true;
      }

      // Deterministic hash noise for authentic grain & textile weave
      function hashNoise(x, y) {
        const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      // 2. Process Layers & Screen Pattern
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const outIdx = (y * w + x) * 4;

          // Base paper color + woven fabric/kraft grain
          const weave = (Math.sin(x * 1.4) + Math.cos(y * 1.4)) * 0.5;
          const fineGrain = (hashNoise(x, y) - 0.5) * 2;
          const fiberDelta = (weave * 7 + fineGrain * 18) * textureAmt;

          let pr = paper.r + fiberDelta;
          let pg = paper.g + fiberDelta;
          let pb = paper.b + fiberDelta;

          if (paper.darkFiber && fineGrain > 0.65) {
            pr -= 18 * textureAmt;
            pg -= 18 * textureAmt;
            pb -= 18 * textureAmt;
          }

          // Accumulate each ink layer using Subtractive / Multiply Riso blending
          for (let k = 0; k < inkObjs.length; k++) {
            const ink = inkObjs[k];
            const shiftX = k === 0 ? 0 : (k === 1 ? shiftPx : -shiftPx * 0.7);
            const shiftY = k === 0 ? 0 : (k === 1 ? shiftPx * 0.6 : shiftPx);

            const sx = Math.round(x - padX - shiftX);
            const sy = Math.round(y - padY - shiftY);

            if (!insideRoundedRect(sx, sy, innerW, innerH, cornerRadius)) continue;

            const pIdx = (sy * innerW + sx) * 4;
            const r = srcData[pIdx] / 255;
            const g = srcData[pIdx + 1] / 255;
            const b = srcData[pIdx + 2] / 255;

            // Calculate channel separation density based on number of inks
            let density = 0;
            const luma = 0.299 * r + 0.587 * g + 0.114 * b;
            const cLuma = Math.min(1, Math.max(0, (luma - 0.5) * contrast + 0.5));

            if (inkObjs.length === 1) {
              density = 1 - cLuma;
            } else if (inkObjs.length === 2) {
              if (k === 0) {
                // Warm / Highlight-midtone plate
                const warmDiff = Math.max(0, r - b * 0.65);
                density = Math.min(1, warmDiff * 1.35 + (1 - cLuma) * 0.45);
              } else {
                // Shadow / Cool plate
                density = Math.pow(1 - cLuma, 1.15);
              }
            } else {
              if (k === 0) {
                // Plate 1 (e.g. Yellow / Warm)
                density = Math.min(1, Math.max(0, (r + g * 0.5 - b) * 0.9));
              } else if (k === 1) {
                // Plate 2 (e.g. Orange / Pink / Red)
                density = Math.min(1, Math.max(0, (r - g * 0.35) * 1.25 + (1 - cLuma) * 0.25));
              } else {
                // Plate 3 (e.g. Blue / Black / Shadow)
                density = Math.pow(1 - cLuma, 1.25);
              }
            }

            // Screen modulation (Rosette / Halftone / Grain / Hatch)
            const ang = angles[k % 3];
            const rx = x * Math.cos(ang) - y * Math.sin(ang);
            const ry = x * Math.sin(ang) + y * Math.cos(ang);

            let threshold = 0.5;
            if (styleMode === 'ROSETTE') {
              const s = (Math.sin(rx * freq) + Math.cos(ry * freq)) * 0.25 + 0.5;
              threshold = s * 0.82 + fineGrain * 0.09;
            } else if (styleMode === 'HALFTONE') {
              threshold = (Math.sin(rx * freq) * Math.sin(ry * freq)) * 0.45 + 0.5;
            } else if (styleMode === 'GRAIN') {
              threshold = hashNoise(x + k * 71, y + k * 43) * 0.88 + 0.06;
            } else if (styleMode === 'HATCH') {
              threshold = (Math.sin(rx * freq * 1.25) * 0.45 + 0.5) * 0.85 + fineGrain * 0.08;
            }

            // Soft ink bleed edge
            const inkAlpha = Math.min(1, Math.max(0, (density - threshold + 0.14) * 3.6));

            if (inkAlpha > 0.01) {
              // Riso ink translucent multiply + vibrant pigment mix
              const strength = 0.86 * inkAlpha;
              const multR = (pr * ink.r) / 255;
              const multG = (pg * ink.g) / 255;
              const multB = (pb * ink.b) / 255;

              const targetR = multR * 0.55 + ink.r * 0.45;
              const targetG = multG * 0.55 + ink.g * 0.45;
              const targetB = multB * 0.55 + ink.b * 0.45;

              pr = pr * (1 - strength) + targetR * strength;
              pg = pg * (1 - strength) + targetG * strength;
              pb = pb * (1 - strength) + targetB * strength;
            }
          }

          out[outIdx]     = Math.min(255, Math.max(0, pr));
          out[outIdx + 1] = Math.min(255, Math.max(0, pg));
          out[outIdx + 2] = Math.min(255, Math.max(0, pb));
          out[outIdx + 3] = 255;
        }
      }

      tCtx.putImageData(outImgData, 0, 0);
    }

    function getCurrentConfig() {
      return {
        inks: [...state.inks],
        paperId: PAPERS[state.paperIndex].id,
        styleMode: STYLES[state.styleIndex],
        dotSize: state.dotSize,
        texture: state.texture,
        contrast: state.contrast,
        shift: state.shift,
        margin: state.margin
      };
    }

    function renderMainCanvas() {
      renderRisoToCanvas(mainCanvas, getCurrentConfig(), 880);
    }

    function renderAll() {
      updateUI();
      renderMainCanvas();
    }

    // Preset Grid Renderer
    function renderPresetGrid() {
      const grid = document.getElementById('presetGrid');
      grid.innerHTML = '';

      state.presets.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'preset-card';

        const wrap = document.createElement('div');
        wrap.className = 'preset-thumb-wrap';

        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.className = 'preset-thumb-canvas';
        wrap.appendChild(thumbCanvas);

        const title = document.createElement('div');
        title.className = 'preset-title';
        title.textContent = p.title;

        card.appendChild(wrap);
        card.appendChild(title);
        grid.appendChild(card);

        // Render thumbnail
        setTimeout(() => {
          renderRisoToCanvas(thumbCanvas, {
            inks: p.inks,
            paperId: p.paper,
            styleMode: p.style,
            dotSize: 5.5,
            texture: 48,
            contrast: 115,
            shift: p.shift ?? 4,
            margin: p.margin ?? 14
          }, 260);
        }, 10);

        card.addEventListener('click', () => {
          state.inks = [...p.inks];
          state.activeTabIndex = 0;
          const pIdx = PAPERS.findIndex(item => item.id === p.paper);
          if (pIdx !== -1) state.paperIndex = pIdx;
          const sIdx = STYLES.indexOf(p.style);
          if (sIdx !== -1) state.styleIndex = sIdx;
          state.margin = p.margin ?? 14;
          state.shift = p.shift ?? 4;

          document.getElementById('presetModal').classList.remove('open');
          renderAll();
        });
      });
    }

    /**************************************************************
     * PWA Icon Generator (192x192 & 512x512 PNG)
     **************************************************************/
    function downloadPWAIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const g = c.getContext('2d');
      const s = size / 512;

      // Dark matte card background
      g.fillStyle = '#121212';
      g.fillRect(0, 0, size, size);

      // Inner frame
      g.fillStyle = '#1c1c1c';
      g.strokeStyle = '#333333';
      g.lineWidth = 8 * s;
      const pad = 42 * s;
      const w = size - pad * 2;
      g.beginPath();
      g.roundRect(pad, pad, w, w, 84 * s);
      g.fill();
      g.stroke();

      // Riso overlapping halftone circles (Pink, Blue, Yellow)
      g.globalCompositeOperation = 'screen';

      g.fillStyle = '#ff48b0';
      g.beginPath();
      g.arc(215 * s, 235 * s, 105 * s, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = '#0078bf';
      g.beginPath();
      g.arc(298 * s, 278 * s, 105 * s, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = '#ffe800';
      g.beginPath();
      g.arc(256 * s, 200 * s, 72 * s, 0, Math.PI * 2);
      g.fill();

      g.globalCompositeOperation = 'source-over';

      // Subtle grain overlay on icon
      const imgData = g.getImageData(0, 0, size, size);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const noise = (Math.random() - 0.5) * 18;
        d[i]     = Math.min(255, Math.max(0, d[i] + noise));
        d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + noise));
        d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + noise));
      }
      g.putImageData(imgData, 0, 0);

      c.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    /**************************************************************
     * Event Listeners
     **************************************************************/
    document.getElementById('btnUpload').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          state.sourceImage = img;
          renderMainCanvas();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btnQuickInvert').addEventListener('click', () => {
      state.inks.reverse();
      renderAll();
    });

    document.getElementById('btnAutoBalance').addEventListener('click', () => {
      state.dotSize = 5.5;
      state.texture = 48;
      state.contrast = 115;
      state.shift = 4;
      renderAll();
    });

    document.getElementById('btnRandom').addEventListener('click', () => {
      const count = Math.random() > 0.38 ? 2 : 3;
      const shuffled = [...INKS].sort(() => 0.5 - Math.random());
      state.inks = shuffled.slice(0, count).map(i => i.id);
      state.activeTabIndex = 0;
      state.paperIndex = Math.floor(Math.random() * PAPERS.length);
      state.styleIndex = Math.floor(Math.random() * STYLES.length);
      renderAll();
    });

    document.getElementById('btnStyle').addEventListener('click', () => {
      state.styleIndex = (state.styleIndex + 1) % STYLES.length;
      renderAll();
    });

    document.getElementById('btnFrame').addEventListener('click', () => {
      const margins = [0, 10, 15, 20];
      const nextIdx = (margins.indexOf(state.margin) + 1) % margins.length;
      state.margin = margins[nextIdx];
      renderAll();
    });

    document.getElementById('btnGrainToggle').addEventListener('click', () => {
      state.texture = state.texture > 10 ? 0 : 55;
      renderAll();
    });

    document.getElementById('btnPaperCycle').addEventListener('click', () => {
      state.paperIndex = (state.paperIndex + 1) % PAPERS.length;
      renderAll();
    });

    const toggleDrawer = () => drawerPanel.classList.toggle('open');
    document.getElementById('btnToneDrawer').addEventListener('click', toggleDrawer);
    document.getElementById('btnSettings').addEventListener('click', toggleDrawer);

    // Sliders
    const bindSlider = (id, key) => {
      document.getElementById(id).addEventListener('input', (e) => {
        state[key] = parseFloat(e.target.value);
        updateUI();
        renderMainCanvas();
      });
    };
    bindSlider('rngDotSize', 'dotSize');
    bindSlider('rngTexture', 'texture');
    bindSlider('rngContrast', 'contrast');
    bindSlider('rngShift', 'shift');
    bindSlider('rngMargin', 'margin');

    // Presets Modal
    document.getElementById('btnOpenPresets').addEventListener('click', () => {
      document.getElementById('presetModal').classList.add('open');
      renderPresetGrid();
    });

    document.getElementById('btnClosePresets').addEventListener('click', () => {
      document.getElementById('presetModal').classList.remove('open');
    });

    document.getElementById('btnSavePreset').addEventListener('click', () => {
      const title = state.inks
        .map(id => {
          const name = INKS.find(i => i.id === id)?.name || id;
          return name.charAt(0) + name.slice(1).toLowerCase();
        })
        .join(' + ');

      const newPreset = {
        title: title + ' Custom',
        inks: [...state.inks],
        paper: PAPERS[state.paperIndex].id,
        style: STYLES[state.styleIndex],
        margin: state.margin || 14,
        shift: state.shift
      };

      state.presets.unshift(newPreset);
      try {
        const customOnly = state.presets.slice(0, state.presets.length - DEFAULT_PRESETS.length);
        localStorage.setItem('risoprint_custom_presets', JSON.stringify(customOnly));
      } catch (e) {}
      renderPresetGrid();
    });

    // High-Res Export
    document.getElementById('btnExport').addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      renderRisoToCanvas(exportCanvas, getCurrentConfig(), 2000);
      exportCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `risoprint-${Date.now()}.png`;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    });

    // PWA Icon Download Buttons
    document.getElementById('btnDl192').addEventListener('click', () => downloadPWAIcon(192));
    document.getElementById('btnDl512').addEventListener('click', () => downloadPWAIcon(512));

    // Initialize
    initSwatches();
    createDefaultImage();

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('SW registration skipped:', err);
        });
      });
    }
  </script>
</body>
